services:
  # The Web App
  - type: web
    name: aqi-web-platform
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn run:app"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aqi-database
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.10.0

  # The Background Data Generator
  - type: worker
    name: aqi-data-generator
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python live_data_service.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0

# The Cloud PostgreSQL Database
databases:
  - name: aqi-database
    databaseName: aqi
    user: aqi_user
