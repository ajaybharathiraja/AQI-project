{% extends "base.html" %}

{% block title %}Register - AQI Platform{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-lg border-0 rounded-lg">
            <div class="card-header bg-success text-white text-center py-4">
                <h3 class="mb-0 fw-bold">Create Account</h3>
            </div>
            <div class="card-body p-4 p-md-5 bg-white">
                <form method="POST" action="{{ url_for('auth.register') }}">
                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold text-uppercase">Full Name</label>
                        <div class="input-group input-group-lg">
                            <span class="input-group-text bg-light border-end-0"><i class="fas fa-user text-muted"></i></span>
                            <input type="text" name="name" class="form-control border-start-0 ps-0" placeholder="John Doe" required autofocus>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold text-uppercase">Email Address</label>
                        <div class="input-group input-group-lg">
                            <span class="input-group-text bg-light border-end-0"><i class="fas fa-envelope text-muted"></i></span>
                            <input type="email" name="email" class="form-control border-start-0 ps-0" placeholder="user@example.com" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold text-uppercase">Password</label>
                        <div class="input-group input-group-lg">
                            <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted"></i></span>
                            <input type="password" name="password" class="form-control border-start-0 ps-0" placeholder="••••••••" required>
                        </div>
                    </div>
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-success btn-lg fw-bold rounded-pill shadow-sm transition-all hover-lift">Register Now</button>
                    </div>
                </form>
            </div>
            <div class="card-footer bg-light text-center py-3">
                <p class="mb-0 text-muted">Already have an account? <a href="{{ url_for('auth.login') }}" class="text-success fw-bold text-decoration-none">Login here</a></p>
            </div>
        </div>
    </div>
</div>
<style>
    .hover-lift:hover { transform: translateY(-2px); box-shadow: 0 .5rem 1rem rgba(0,0,0,.15)!important; }
    .transition-all { transition: all 0.2s ease-in-out; }
    .input-group-text { background-color: #f8f9fa; }
    .form-control:focus { box-shadow: none; border-color: #dee2e6; }
    .input-group:focus-within { box-shadow: 0 0 0 0.25rem rgba(25,135,84,.25); border-radius: 0.375rem; }
    .input-group:focus-within .form-control, .input-group:focus-within .input-group-text { border-color: #75b798; }
</style>
{% endblock %}
