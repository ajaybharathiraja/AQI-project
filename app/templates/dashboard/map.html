{% extends "base.html" %}

{% block title %}Pollution Hotspots - AQI Platform{% endblock %}

{% block head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<style>
    #map { height: 600px; border-radius: 1rem; box-shadow: 0 .125rem .25rem rgba(0,0,0,.075); }
    .info-window { font-family: 'Inter', sans-serif; }
    .info-window h6 { margin: 0 0 5px 0; font-weight: bold; }
    .info-window p { margin: 0; font-size: 13px; color: #6c757d; }
</style>
{% endblock %}

{% block content %}
<div class="row mt-4">
    <div class="col-12">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold"><i class="fas fa-map-marked-alt text-success me-2"></i>Pollution Hotspots & Mapping</h2>
            <a href="{{ url_for('dashboard.index') }}" class="btn btn-outline-secondary">Back to Dashboard</a>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-12 mb-4">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-2">
                <div id="map"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script id="map-data" type="application/json">
{{ map_data | tojson | safe }}
</script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        // Initialize map centered around Tamil Nadu / Chennai area
        var map = L.map('map').setView([11.1271, 78.6569], 7);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);
        
        var stationsData = JSON.parse(document.getElementById('map-data').textContent);
        
        // Custom marker colors based on AQI
        function getMarkerColor(aqi) {
            if (aqi <= 50) return 'green';
            if (aqi <= 100) return 'yellow';
            if (aqi <= 150) return 'orange';
            if (aqi <= 200) return 'red';
            return 'purple'; // Very unhealthy
        }

        stationsData.forEach(function(station) {
            var color = getMarkerColor(station.aqi);
            
            // Create a custom circle marker
            var marker = L.circleMarker([station.lat, station.lon], {
                radius: 12,
                fillColor: color,
                color: "#fff",
                weight: 2,
                opacity: 1,
                fillOpacity: 0.8
            }).addTo(map);

            var popupContent = `
                <div class="info-window p-1" style="min-width: 200px;">
                    <h6 class="text-primary mb-1 fw-bold">${station.name}</h6>
                    <p class="text-muted small mb-2"><i class="fas fa-city me-1"></i>${station.city}</p>
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="badge rounded-pill" style="background-color: ${color}; color: ${color === 'yellow' ? '#000' : '#fff'};">
                            ${station.cat}
                        </span>
                        <span class="fw-bold" style="color: ${color}; font-size: 1.1rem;">AQI: ${station.aqi}</span>
                    </div>
                    <hr class="my-2">
                    <div class="row g-1 small text-muted">
                        <div class="col-6">PM2.5: <span class="fw-bold text-dark">${station.pm25}</span></div>
                        <div class="col-6">PM10: <span class="fw-bold text-dark">${station.pm10}</span></div>
                        <div class="col-6">NO2: <span class="fw-bold text-dark">${station.no2}</span></div>
                        <div class="col-6">SO2: <span class="fw-bold text-dark">${station.so2}</span></div>
                        <div class="col-6">CO: <span class="fw-bold text-dark">${station.co}</span></div>
                        <div class="col-6">O3: <span class="fw-bold text-dark">${station.ozone}</span></div>
                    </div>
                </div>
            `;
            marker.bindPopup(popupContent);
        });

        // Add Legend to map
        var legend = L.control({position: 'bottomright'});
        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'info legend bg-white p-3 rounded shadow-sm');
            div.innerHTML = `
                <h6 class="fw-bold mb-2 small text-uppercase">AQI Legend</h6>
                <div class="d-flex align-items-center mb-1"><span style="display:inline-block; width:15px; height:15px; background:green; border-radius:50%; margin-right:8px;"></span> Good (0-50)</div>
                <div class="d-flex align-items-center mb-1"><span style="display:inline-block; width:15px; height:15px; background:yellow; border-radius:50%; margin-right:8px;"></span> Satisfactory (51-100)</div>
                <div class="d-flex align-items-center mb-1"><span style="display:inline-block; width:15px; height:15px; background:orange; border-radius:50%; margin-right:8px;"></span> Moderate (101-200)</div>
                <div class="d-flex align-items-center mb-1"><span style="display:inline-block; width:15px; height:15px; background:red; border-radius:50%; margin-right:8px;"></span> Poor (201-300)</div>
                <div class="d-flex align-items-center"><span style="display:inline-block; width:15px; height:15px; background:purple; border-radius:50%; margin-right:8px;"></span> Severe (301+)</div>
            `;
            return div;
        };
        legend.addTo(map);
    });
</script>
{% endblock %}
