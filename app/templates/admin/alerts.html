{% extends "base.html" %}

{% block title %}Alert Messages - Admin{% endblock %}

{% block content %}
<div class="row mt-4">
    <div class="col-12">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold"><i class="fas fa-exclamation-triangle text-danger me-2"></i>System Alerts</h2>
            <a href="{{ url_for('admin.dashboard') }}" class="btn btn-outline-secondary">Back to Admin</a>
        </div>
    </div>
</div>

<div class="card shadow-sm border-0 rounded-4">
    <div class="card-body text-center py-5">
        <i class="fas fa-check-circle fa-4x text-success mb-3"></i>
        <h4 class="fw-bold text-muted">No Active System Alerts</h4>
        <p class="text-muted">The platform is running smoothly. Any backend system errors, missing data alerts, or server issues will appear here.</p>
    </div>
</div>
{% endblock %}
